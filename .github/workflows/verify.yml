name: Plugin Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
      - '.run/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
      - '.run/**'
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache IntelliJ Platform IDEs
        uses: actions/cache@v4
        with:
          path: |
            ~/.pluginVerifier
            .intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run plugin verifier
        run: ./gradlew verifyPlugin
