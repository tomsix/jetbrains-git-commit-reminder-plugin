name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
      - '.run/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.idea/**'
      - '.run/**'
      - '.claude/**'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache IntelliJ Platform
        uses: actions/cache@v4
        with:
          path: .intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test
