name: Publish to JetBrains Marketplace

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    name: Sign and publish to Marketplace
    needs: [test, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache IntelliJ Platform
        uses: actions/cache@v4
        with:
          path: .intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
